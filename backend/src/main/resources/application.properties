spring.application.name=app

# Carrega variaveis do arquivo .env (opcional)
spring.config.import=optional:file:.env[.properties]

# Banco em memoria para desenvolvimento (trocar para MySQL em producao)
spring.datasource.url=jdbc:h2:mem:matriculas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# Autenticacao JWT (defina JWT_SECRET em producao)
app.jwt.secret=${JWT_SECRET:dev-secret-troque-em-producao}
app.jwt.expiracao-minutos=120

# Secretario criado na primeira inicializacao (defina ADMIN_EMAIL/ADMIN_SENHA em producao)
app.admin.email=${ADMIN_EMAIL:admin@matriculas.com}
app.admin.senha=${ADMIN_SENHA:admin123}
